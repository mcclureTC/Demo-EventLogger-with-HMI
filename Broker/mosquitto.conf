# Event Logger Demo broker: Mosquitto 2.x set up to behave like AWS IoT Core.
#
#   - TLS on port 8883 only, with a client certificate required (mutual TLS)
#   - the certificate's common name is the client's identity, like an AWS Thing Name
#   - an ACL limits each identity to its own topics, like an AWS IoT policy
#   - retained messages survive a broker restart
#
# Start it with run-broker.cmd, which runs from this folder so the relative paths below resolve.
# Create the certificates first: dotnet run --project ..\Tools\CertTool

per_listener_settings true

persistence true
persistence_location data/

log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# -----------------------------------------------------------------------------
# Main listener: the AWS-like path. Everything in the demo uses this one.
# -----------------------------------------------------------------------------
listener 8883
protocol mqtt
cafile   certs/ca.crt
certfile certs/broker.crt
keyfile  certs/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file acl.conf

# -----------------------------------------------------------------------------
# Diagnostic listener: plain MQTT, no TLS, this PC only.
#
# Not AWS-like: there is no client identity, so the per-device topic rules cannot apply.
# Enable it only to find out whether a connection problem is caused by the certificates:
#   1. remove the # in front of the four lines below and restart the broker
#   2. PLC: GVL_MqttSite.UseTls := FALSE and BrokerPort := 1883
#   3. HMI: "UseTls": false and "Port": 1883 under "Broker" in appsettings.json
# Put everything back afterwards. A Windows Mosquitto service listening on 1883 must be stopped
# first (net stop mosquitto).
# -----------------------------------------------------------------------------
#listener 1883 127.0.0.1
#protocol mqtt
#allow_anonymous true
#acl_file acl-diagnostic.conf
