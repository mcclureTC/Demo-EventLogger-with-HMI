# Topic rules for the TLS listener. The user name is the client certificate's common name.
#
# Equivalent to the AWS IoT policies in the documentation:
#   devices publish only under their own Thing Name, the HMI only reads.

# Every device may publish under its own name, including its Last Will on .../status.
pattern write dt/eventloggerdemo/%u/#

# The HMI consumer reads every demo device and publishes nothing.
user eventloggerdemo-hmi
topic read dt/eventloggerdemo/+/#
